name: Publish development image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: development-image
  cancel-in-progress: true

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verified-build.yml
    with:
      ref: ${{ github.sha }}

  images:
    needs: ci
    uses: ./.github/workflows/publish-images.yml
    with:
      sha: ${{ needs.ci.outputs.sha }}
      run-id: ${{ needs.ci.outputs.run-id }}
      image-tag: latest
