name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate manual publish ref
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *)
              echo "Container publishing can only be dispatched from main or a version tag." >&2
              exit 1
              ;;
          esac

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify release metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "Version tag $RELEASE_TAG does not match package.json version $package_version." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Version tag $RELEASE_TAG does not point to a commit on main." >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Check unused files and exports
        run: pnpm check:dead-code

      - name: Run unit tests
        run: pnpm test

      - name: Check out API Service main
        uses: actions/checkout@v7
        with:
          repository: NuoXianTech/openapi-service
          ref: main
          path: openapi-service
          persist-credentials: false

      - name: Install API Service dependencies
        working-directory: openapi-service
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build API Service main
        working-directory: openapi-service
        run: pnpm build

      - name: Run API Service integration tests
        env:
          OPENAPI_SERVICE_REPO: ${{ github.workspace }}/openapi-service
        run: pnpm test:api-service

      - name: Build Platform and test the deployment artifact
        run: |
          pnpm build
          pnpm test:integration

  build:
    name: Build image (${{ matrix.arch }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract architecture image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            suffix=-${{ matrix.arch }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build architecture image for local verification
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=openapi-platform-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=openapi-platform-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Verify image startup, migrations and restart
        shell: bash
        env:
          IMAGE_TAGS_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          set -euo pipefail
          image="$(jq -r '.tags[0]' <<< "$IMAGE_TAGS_JSON")"
          container="platform-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -fv "$container" >/dev/null 2>&1 || true' EXIT

          # Isolated, disposable CI configuration; never use deployment secrets.
          docker run -d --name "$container" \
            -p 127.0.0.1::3000 -v /app/.data \
            -e NUXT_AUTH_SECRET=ci-image-auth-secret-0123456789abcdef \
            -e NUXT_API_KEY_SECRET=0123456789abcdef0123456789abcdef \
            "$image"

          wait_ready() {
            local port
            port="$(docker port "$container" 3000/tcp | cut -d: -f2)"
            for attempt in $(seq 1 60); do
              if [[ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]]; then
                break
              fi
              if curl -fsS --max-time 2 "http://127.0.0.1:${port}/api/ready" | jq -e '.ready == true' >/dev/null; then
                curl -fsS --max-time 5 "http://127.0.0.1:${port}/api/health" | jq -e '.ok == true' >/dev/null
                return 0
              fi
              sleep 2
            done
            docker logs "$container" 2>&1 | sed -E 's/(initial password: ).*/\1[redacted]/'
            return 1
          }

          wait_ready
          docker stop --time 30 "$container"
          docker start "$container"
          wait_ready

      - name: Push the verified image
        shell: bash
        env:
          IMAGE_TAGS_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker push "$tag"
          done < <(jq -r '.tags[]' <<< "$IMAGE_TAGS_JSON")

  merge:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract multi-platform image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create multi-platform manifests
        shell: bash
        env:
          IMAGE_TAGS_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$IMAGE_TAGS_JSON")
          for tag in "${tags[@]}"; do
            docker buildx imagetools create \
              --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

      - name: Inspect published images
        shell: bash
        env:
          IMAGE_TAGS_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker buildx imagetools inspect "$tag"
          done < <(jq -r '.tags[]' <<< "$IMAGE_TAGS_JSON")

  cleanup:
    name: Clean up stale container images
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ghcr-cleanup-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Delete untagged and legacy SHA images
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: ${{ github.repository_owner }}
          package: ${{ github.event.repository.name }}
          delete-untagged: 'true'
          delete-tags: 'sha-*'
          validate: 'true'
