name: Continuous Integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  pull-request-policy:
    name: Pull request policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate Conventional Commit title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([A-Za-z0-9._/-]+\))?!?: .+'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "### Pull request policy" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ Title follows the Conventional Commits specification." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Pull request policy"
            echo "❌ The title does not follow the Conventional Commits specification."
            echo
            echo 'Expected: `type(scope): concise description`'
            echo
            echo 'Example: `feat(auth): add passkey sign-in`'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Invalid pull request title: $PR_TITLE" >&2
          echo "Expected Conventional Commits format, for example: feat(auth): add passkey sign-in" >&2
          exit 1

      - name: Check out source for version policy
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version change
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          base_version="$(git show "${BASE_SHA}:package.json" | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          head_version="$(node -p "require('./package.json').version")"

          if [[ "$base_version" == "$head_version" ]]; then
            echo "No application version change detected." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          expected_branch="release/v${head_version}"
          if [[ "$HEAD_BRANCH" != "$expected_branch" ]]; then
            {
              echo "### Version policy"
              echo "❌ Application version changed from \`${base_version}\` to \`${head_version}\`."
              echo
              echo "Version changes must come from branch \`${expected_branch}\`, not \`${HEAD_BRANCH}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Version changes must come from branch ${expected_branch}, not ${HEAD_BRANCH}." >&2
            exit 1
          fi

          {
            echo "### Version policy"
            echo "✅ Validated version change: \`${base_version}\` → \`${head_version}\`."
            echo
            echo "Release branch: \`${HEAD_BRANCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  application-quality:
    name: Application quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check code style and correctness
        run: pnpm lint

      - name: Verify TypeScript types
        run: pnpm typecheck

      - name: Check unused files and exports
        run: pnpm check:dead-code

      - name: Run unit test suite
        run: pnpm test

      - name: Check out API Service main
        uses: actions/checkout@v7
        with:
          repository: NuoXianTech/openapi-service
          ref: main
          path: openapi-service
          persist-credentials: false

      - name: Install API Service dependencies
        working-directory: openapi-service
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build API Service main
        working-directory: openapi-service
        run: pnpm build

      - name: Run Platform and API Service acceptance suite
        env:
          OPENAPI_SERVICE_REPO: ${{ github.workspace }}/openapi-service
        run: pnpm test:api-service

      - name: Build production application
        run: pnpm build

      - name: Run integration test suite
        run: pnpm test:integration

      - name: Archive the tested distribution
        run: node scripts/release/distribution.mjs archive .output "$RUNNER_TEMP/ci-distribution"

      - name: Upload the tested distribution
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ci-distribution
          path: |
            ${{ runner.temp }}/ci-distribution/ci-distribution.tar
            ${{ runner.temp }}/ci-distribution/ci-build.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Publish validation summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Application quality"
            echo "✅ Linting, type checking, dead-code analysis, unit and Service acceptance tests, and the production build completed successfully."
            echo
            echo "- Node.js: \`$(node --version)\`"
            echo "- pnpm: \`$(pnpm --version)\`"
            echo "- Commit: \`${GITHUB_SHA::12}\`"
          } >> "$GITHUB_STEP_SUMMARY"
