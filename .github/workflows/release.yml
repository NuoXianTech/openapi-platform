name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release, for example v0.1.5'
        required: true
        type: string

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/verified-build.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  package:
    name: Package the verified Node server
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: ci-distribution
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ci-distribution
      - name: Restore verified distribution
        env:
          EXPECTED_SHA: ${{ needs.ci.outputs.sha }}
        run: node scripts/release/distribution.mjs restore "$RUNNER_TEMP/ci-distribution" .output
      - name: Package application and checksums
        run: node scripts/release/distribution.mjs package .output release
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            release/*.tar.gz
            release/checksums.txt
          compression-level: 0
          if-no-files-found: error

  images:
    needs: ci
    uses: ./.github/workflows/publish-images.yml
    with:
      sha: ${{ needs.ci.outputs.sha }}
      run-id: ${{ needs.ci.outputs.run-id }}
      image-tag: ${{ needs.ci.outputs.version }}

  publish:
    name: Publish the complete release
    needs: [ci, package, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release
      - name: Verify release files
        env:
          VERSION: ${{ needs.ci.outputs.version }}
        run: |
          test -s "release/openapi-platform-${VERSION}.tar.gz"
          (cd release && sha256sum --check checksums.txt)

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..${RELEASE_TAG}"
            comparison_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${RELEASE_TAG}"
          else
            commit_range="${RELEASE_TAG}"
            comparison_url="https://github.com/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}"
          fi

          {
            echo "## Changes"
            echo
            git log "$commit_range" --first-parent \
              --pretty=format:'- %s ([`%h`](https://github.com/'"${GITHUB_REPOSITORY}"'/commit/%H))'
            echo
            echo
            echo "**Full Changelog**: ${comparison_url}"
          } > "${RUNNER_TEMP}/release-notes.md"

      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.ci.outputs.version }}
          PRERELEASE: ${{ needs.ci.outputs.prerelease }}
        run: |
          set -euo pipefail
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$state" == false ]]; then
              # Published assets and operator-edited notes are immutable here.
              gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published-release" \
                --pattern "openapi-platform-${VERSION}.tar.gz" --pattern checksums.txt
              (cd "$RUNNER_TEMP/published-release" && sha256sum --check checksums.txt)
              echo "Release already published; verified its assets." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "OpenAPI Platform $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" release/*.tar.gz release/checksums.txt --clobber
          latest=true
          if [[ "$PRERELEASE" == true ]]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"
