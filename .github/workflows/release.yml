name: Create GitHub release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate version tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Expected a semantic version such as v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi

          echo "number=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} does not point to a commit on main." >&2
            echo "Merge the release PR first, then create the tag from the updated main branch." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package.json version ${package_version}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Check unused files and exports
        run: pnpm check:dead-code

      - name: Run unit tests
        run: pnpm test

      - name: Check out API Service main
        uses: actions/checkout@v7
        with:
          repository: NuoXianTech/openapi-service
          ref: main
          path: openapi-service
          persist-credentials: false

      - name: Install API Service dependencies
        working-directory: openapi-service
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build API Service main
        working-directory: openapi-service
        run: pnpm build

      - name: Run Platform and API Service acceptance suite
        env:
          OPENAPI_SERVICE_REPO: ${{ github.workspace }}/openapi-service
        run: pnpm test:api-service

      - name: Build production server
        run: pnpm build

      - name: Run integration tests
        run: pnpm test:integration

      - name: Package application
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          package_name="openapi-platform-${VERSION}"
          archive_name="${package_name}.tar.gz"
          package_dir="${RUNNER_TEMP}/${package_name}"

          mkdir -p "$package_dir" release
          cp -a .output/. "$package_dir/"
          cp .env.example LICENSE README.md README_ZH.md "$package_dir/"

          tar -czf "release/${archive_name}" \
            -C "$RUNNER_TEMP" "$package_name"

          (
            cd release
            sha256sum "${archive_name}" > checksums.txt
          )

      - name: Verify release package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          package_name="openapi-platform-${VERSION}"
          archive_name="${package_name}.tar.gz"
          contents_file="${RUNNER_TEMP}/${package_name}-contents.txt"

          tar -tzf "release/${archive_name}" > "$contents_file"
          grep -Fxq "${package_name}/package.json" "$contents_file"
          grep -Fxq "${package_name}/server/index.mjs" "$contents_file"
          grep -Fxq "${package_name}/server/start.mjs" "$contents_file"
          grep -Fxq "${package_name}/server/doctor.mjs" "$contents_file"
          grep -Fxq "${package_name}/server/runtime-config.mjs" "$contents_file"
          grep -Fxq "${package_name}/server/runtime-checks.mjs" "$contents_file"
          grep -Fxq "${package_name}/server/pglite-client.mjs" "$contents_file"
          grep -Fxq "${package_name}/server/migrate.mjs" "$contents_file"
          grep -Fxq "${package_name}/server/database-migrator.mjs" "$contents_file"
          grep -Fxq "${package_name}/server/db/migrations/postgresql/meta/_journal.json" "$contents_file"
          grep -Fxq "${package_name}/.env.example" "$contents_file"
          grep -Fxq "${package_name}/LICENSE" "$contents_file"
          grep -Fxq "${package_name}/README.md" "$contents_file"
          grep -Fxq "${package_name}/README_ZH.md" "$contents_file"
          if grep -Fq "${package_name}/.output/" "$contents_file"; then
            echo "Release package must contain the contents of .output, not a nested .output directory." >&2
            exit 1
          fi
          PACKAGE_JSON="${RUNNER_TEMP}/${package_name}/package.json" node -e '
            const { readFileSync } = require("node:fs")
            const packageJson = JSON.parse(readFileSync(process.env.PACKAGE_JSON, "utf8"))
            if (packageJson.scripts?.start !== "node server/start.mjs" || packageJson.scripts?.migrate !== "node server/migrate.mjs" || packageJson.scripts?.doctor !== "node server/doctor.mjs") {
              throw new Error("Release package has invalid runtime scripts.")
            }
          '
          (
            cd release
            sha256sum --check checksums.txt
          )

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..${RELEASE_TAG}"
            comparison_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${RELEASE_TAG}"
          else
            commit_range="${RELEASE_TAG}"
            comparison_url="https://github.com/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}"
          fi

          {
            notes_file="docs/releases/${RELEASE_TAG}.md"
            if [[ -f "$notes_file" ]]; then
              cat "$notes_file"
              echo
              echo
            fi
            echo "## Changes"
            echo
            git log "$commit_range" --first-parent \
              --pretty=format:'- %s ([`%h`](https://github.com/'"${GITHUB_REPOSITORY}"'/commit/%H))'
            echo
            echo
            echo "**Full Changelog**: ${comparison_url}"
          } > "${RUNNER_TEMP}/release-notes.md"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: OpenAPI Platform ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          files: |
            release/*
